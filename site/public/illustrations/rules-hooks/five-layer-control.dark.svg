<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Five-layer agent control plane</title>
  <desc id="desc">Stacked layers from advisory rules and skills, through tool-enforced permissions, to deterministic hooks and CI gates.</desc>
  <rect width="720" height="420" rx="12" fill="#15171c"/>
  <text x="28" y="36" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Agent control plane</text>
  <text x="28" y="56" fill="#b0b5c0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Advisory → enforced (permissions are not a sandbox)</text>
  <rect x="28" y="78" width="664" height="56" rx="8" fill="#222f49" stroke="#98baff" stroke-width="1.5"/>
  <circle cx="56" cy="106.0" r="14" fill="#98baff" />
  <text x="56" y="110.0" text-anchor="middle" fill="#111c30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="84" y="102" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Rules</text>
  <text x="84" y="120" fill="#b0b5c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AGENTS.md / CLAUDE.md</text>
  <rect x="520" y="94" width="152" height="24" rx="12" fill="#1d2027" stroke="#98baff" stroke-width="1"/>
  <text x="596" y="110" text-anchor="middle" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Advisory</text>
  <path d="M360 135 v8" stroke="#333945" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="28" y="144" width="664" height="56" rx="8" fill="#222630" stroke="#555b66" stroke-width="1.5"/>
  <circle cx="56" cy="172.0" r="14" fill="#98baff" />
  <text x="56" y="176.0" text-anchor="middle" fill="#111c30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">2</text>
  <text x="84" y="168" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Skills</text>
  <text x="84" y="186" fill="#b0b5c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SKILL.md playbooks</text>
  <rect x="520" y="160" width="152" height="24" rx="12" fill="#1d2027" stroke="#555b66" stroke-width="1"/>
  <text x="596" y="176" text-anchor="middle" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">On demand</text>
  <path d="M360 201 v8" stroke="#333945" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="28" y="210" width="664" height="56" rx="8" fill="#1e3027" stroke="#5a9a6e" stroke-width="1.5"/>
  <circle cx="56" cy="238.0" r="14" fill="#98baff" />
  <text x="56" y="242.0" text-anchor="middle" fill="#111c30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">3</text>
  <text x="84" y="234" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Permissions</text>
  <text x="84" y="252" fill="#b0b5c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">deny / ask — not a sandbox</text>
  <rect x="520" y="226" width="152" height="24" rx="12" fill="#1e3027" stroke="#5a9a6e" stroke-width="1"/>
  <text x="596" y="242" text-anchor="middle" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Tool-enforced</text>
  <path d="M360 267 v8" stroke="#333945" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="28" y="276" width="664" height="56" rx="8" fill="#352c1c" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="56" cy="304.0" r="14" fill="#98baff" />
  <text x="56" y="308.0" text-anchor="middle" fill="#111c30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">4</text>
  <text x="84" y="300" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Hooks</text>
  <text x="84" y="318" fill="#b0b5c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PreToolUse · PostToolUse · Stop</text>
  <rect x="520" y="292" width="152" height="24" rx="12" fill="#352c1c" stroke="#c9a227" stroke-width="1"/>
  <text x="596" y="308" text-anchor="middle" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Deterministic</text>
  <path d="M360 333 v8" stroke="#333945" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="28" y="342" width="664" height="56" rx="8" fill="#3a2025" stroke="#d96b6b" stroke-width="1.5"/>
  <circle cx="56" cy="370.0" r="14" fill="#98baff" />
  <text x="56" y="374.0" text-anchor="middle" fill="#111c30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">5</text>
  <text x="84" y="366" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">CI gates</text>
  <text x="84" y="384" fill="#b0b5c0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">check · test · build</text>
  <rect x="520" y="358" width="152" height="24" rx="12" fill="#3a2025" stroke="#d96b6b" stroke-width="1"/>
  <text x="596" y="374" text-anchor="middle" fill="#eeeff3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Pre-merge</text>
</svg>
