<text x="128" y="306" font-size="16" fill="#b6becb" font-weight="400" text-anchor="start">One verified vertical slice</text>
<path d="M24 324 H396" fill="none" stroke="#455061" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="364" font-size="17" fill="#e8c783" font-weight="700" text-anchor="start">28–40h</text>
<text x="128" y="364" font-size="22" fill="#edf0f5" font-weight="650" text-anchor="start">Demo</text>
<text x="128" y="391" font-size="16" fill="#b6becb" font-weight="400" text-anchor="start">Public URL · one clear action</text>
