<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" role="img" aria-labelledby="title desc">
<title id="title">48 小时交付跑道</title><desc id="desc">四段时间，只交付一个可用结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#555b66" stroke-width="1.5"/></marker></defs>
<rect width="420" height="610" rx="12" fill="#fafaf8"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="24" y="31" font-size="12" fill="#555b66" font-weight="650" text-anchor="start">OPC / FIELD GUIDE</text>
<text x="24" y="68" font-size="25" fill="#191b20" font-weight="700" text-anchor="start">48 小时交付跑道</text>
<text x="24" y="96" font-size="17" fill="#555b66" font-weight="400" text-anchor="start">四段时间，只交付一个可用结果。</text>
<rect x="24" y="119" width="31" height="12" rx="0" fill="#1f4b99" stroke="none"/>
<rect x="55" y="119" width="186" height="12" rx="0" fill="#286341" stroke="none"/>
<rect x="241" y="119" width="93" height="12" rx="0" fill="#805a15" stroke="none"/>
<rect x="334" y="119" width="62" height="12" rx="0" fill="#953b3b" stroke="none"/>
<text x="24" y="151" font-size="14" fill="#555b66" font-weight="400" text-anchor="start">0h</text>
<text x="396" y="151" font-size="14" fill="#555b66" font-weight="400" text-anchor="end">48h</text>
<text x="24" y="194" font-size="17" fill="#1f4b99" font-weight="700" text-anchor="start">0–4h</text>
<text x="128" y="194" font-size="22" fill="#191b20" font-weight="650" text-anchor="start">冻结范围</text>
<text x="128" y="221" font-size="16" fill="#555b66" font-weight="400" text-anchor="start">一个用户 · 最多五项任务</text>
<path d="M24 239 H396" fill="none" stroke="#cbd0d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="279" font-size="17" fill="#286341" font-weight="700" text-anchor="start">4–28h</text>
<text x="128" y="279" font-size="22" fill="#191b20" font-weight="650" text-anchor="start">构建切片</text>
<text x="128" y="306" font-size="16" fill="#555b66" font-weight="400" text-anchor="start">一条通过验证的完整路径</text>
<path d="M24 324 H396" fill="none" stroke="#cbd0d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="364" font-size="17" fill="#805a15" font-weight="700" text-anchor="start">28–40h</text>
<text x="128" y="364" font-size="22" fill="#191b20" font-weight="650" text-anchor="start">打通演示</text>
<text x="128" y="391" font-size="16" fill="#555b66" font-weight="400" text-anchor="start">公开链接 · 一个明确行动</text>
<path d="M24 409 H396" fill="none" stroke="#cbd0d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="449" font-size="17" fill="#953b3b" font-weight="700" text-anchor="start">40–48h</text>
<text x="128" y="449" font-size="22" fill="#191b20" font-weight="650" text-anchor="start">冻结功能</text>
<text x="128" y="476" font-size="16" fill="#555b66" font-weight="400" text-anchor="start">只修阻塞问题 · 不加新功能</text>
<path d="M24 494 H396" fill="none" stroke="#cbd0d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="526" width="372" height="70" rx="10" fill="#fff6e5" stroke="none"/>
<text x="42" y="555" font-size="18" fill="#805a15" font-weight="650" text-anchor="start">每到截止点，就缩减范围。</text>
<text x="42" y="580" font-size="17" fill="#805a15" font-weight="400" text-anchor="start">保留交付时间，减少未完成工作。</text></g>
