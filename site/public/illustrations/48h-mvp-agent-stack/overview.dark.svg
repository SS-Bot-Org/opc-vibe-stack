<text x="128" y="449" font-size="22" fill="#edf0f5" font-weight="650" text-anchor="start">Freeze</text>
<text x="128" y="476" font-size="16" fill="#b6becb" font-weight="400" text-anchor="start">Blockers only · no new features</text>
