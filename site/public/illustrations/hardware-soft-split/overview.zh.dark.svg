<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 614" role="img" aria-labelledby="title desc">
<title id="title">三层架构，独立发版</title><desc id="desc">断开云服务，核心控制仍然可用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b6becb" stroke-width="1.5"/></marker></defs>
<rect width="420" height="614" rx="12" fill="#16191e"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="24" y="31" font-size="12" fill="#b6becb" font-weight="650" text-anchor="start">OPC / FIELD GUIDE</text>
<text x="24" y="68" font-size="25" fill="#edf0f5" font-weight="700" text-anchor="start">三层架构，独立发版</text>
<text x="24" y="96" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">断开云服务，核心控制仍然可用。</text>
<rect x="24" y="122" width="372" height="84" rx="10" fill="#20252d" stroke="#455061" stroke-dasharray="6 5"/>
<text x="42" y="155" font-size="23" fill="#edf0f5" font-weight="650" text-anchor="start">云服务 · 可选</text>
<text x="42" y="183" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">备份 / 同步 / 自愿诊断数据</text>
<path d="M210 207 V235" fill="none" stroke="#b6becb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<rect x="24" y="247" width="372" height="85" rx="10" fill="#24314a" stroke="#a4c2ff"/>
<text x="42" y="280" font-size="23" fill="#edf0f5" font-weight="650" text-anchor="start">配套应用</text>
<text x="42" y="308" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">配对 / 控制 / 故障诊断</text>
<path d="M210 333 V355" fill="none" stroke="#b6becb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="210" y="381" font-size="18" fill="#a4c2ff" font-weight="600" text-anchor="middle">BLE / USB 协议与模拟器</text>
<path d="M210 392 V414" fill="none" stroke="#b6becb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="426" width="372" height="85" rx="10" fill="#20362a" stroke="#9cd6ae"/>
<text x="42" y="459" font-size="23" fill="#edf0f5" font-weight="650" text-anchor="start">设备固件</text>
<text x="42" y="487" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">设备行为 / 实物台架测试</text>
<rect x="24" y="531" width="372" height="70" rx="10" fill="#3b3020" stroke="none"/>
<text x="42" y="560" font-size="18" fill="#e8c783" font-weight="650" text-anchor="start">签名密钥由人保管</text>
<text x="42" y="585" font-size="17" fill="#e8c783" font-weight="400" text-anchor="start">通过实物测试，再发布固件</text></g>
</svg>
