<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 630" role="img" aria-labelledby="title desc">
<title id="title">Make done observable</title><desc id="desc">Write the contract before the code.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#555b66" stroke-width="1.5"/></marker></defs>
<rect width="420" height="630" rx="12" fill="#fafaf8"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="24" y="31" font-size="12" fill="#555b66" font-weight="650" text-anchor="start">OPC / FIELD GUIDE</text>
<text x="24" y="68" font-size="25" fill="#191b20" font-weight="700" text-anchor="start">Make done observable</text>
<text x="24" y="96" font-size="17" fill="#555b66" font-weight="400" text-anchor="start">Write the contract before the code.</text>
<rect x="24" y="120" width="372" height="160" rx="10" fill="#ffffff" stroke="#cbd0d8"/>
<text x="43" y="155" font-size="15" fill="#1f4b99" font-weight="700" text-anchor="start">01</text>
<text x="84" y="155" font-size="20" fill="#191b20" font-weight="400" text-anchor="start">User + outcome</text>
<path d="M43 170 H376" fill="none" stroke="#cbd0d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="43" y="203" font-size="15" fill="#1f4b99" font-weight="700" text-anchor="start">02</text>
<text x="84" y="203" font-size="20" fill="#191b20" font-weight="400" text-anchor="start">Scope + non-goals</text>
<path d="M43 218 H376" fill="none" stroke="#cbd0d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="43" y="251" font-size="15" fill="#1f4b99" font-weight="700" text-anchor="start">03</text>
<text x="84" y="251" font-size="20" fill="#191b20" font-weight="400" text-anchor="start">Acceptance + verify</text>
<path d="M210 281 V311" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="324" width="372" height="85" rx="10" fill="#e8eef8" stroke="#1f4b99"/>
<text x="210" y="358" font-size="21" fill="#191b20" font-weight="650" text-anchor="middle">One bounded task</text>
<text x="210" y="387" font-size="18" fill="#555b66" font-weight="400" text-anchor="middle">Implement → run the check</text>
<path d="M210 410 V436 H110 V456" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M210 436 H310 V456" fill="none" stroke="#555b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="468" width="176" height="84" rx="10" fill="#eaf6ee" stroke="#286341"/>
<text x="40" y="499" font-size="18" fill="#286341" font-weight="700" text-anchor="start">PASS</text>
<text x="40" y="528" font-size="17" fill="#191b20" font-weight="400" text-anchor="start">Review + commit</text>
<rect x="220" y="468" width="176" height="84" rx="10" fill="#fff6e5" stroke="#805a15"/>
<text x="236" y="499" font-size="18" fill="#805a15" font-weight="700" text-anchor="start">FAIL</text>
<text x="236" y="528" font-size="17" fill="#191b20" font-weight="400" text-anchor="start">Fix or refine spec</text>
<text x="210" y="597" font-size="18" fill="#555b66" font-weight="400" text-anchor="middle">A green check closes the loop.</text></g>
</svg>
