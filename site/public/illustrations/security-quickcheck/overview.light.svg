<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 641" role="img" aria-labelledby="title desc">
<title id="title">Five surfaces to inspect</title><desc id="desc">A defensive map, not incident proof.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#555b66" stroke-width="1.5"/></marker></defs>
<rect width="420" height="641" rx="12" fill="#fafaf8"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="24" y="31" font-size="12" fill="#555b66" font-weight="650" text-anchor="start">OPC / FIELD GUIDE</text>
<text x="24" y="68" font-size="25" fill="#191b20" font-weight="700" text-anchor="start">Five surfaces to inspect</text>
<text x="24" y="96" font-size="17" fill="#555b66" font-weight="400" text-anchor="start">A defensive map, not incident proof.</text>
<rect x="24" y="122" width="372" height="76" rx="10" fill="#e8eef8" stroke="#1f4b99"/>
<text x="42" y="152" font-size="17" fill="#1f4b99" font-weight="700" text-anchor="start">01</text>
<text x="83" y="152" font-size="21" fill="#191b20" font-weight="650" text-anchor="start">Editor extensions</text>
<text x="83" y="178" font-size="17" fill="#555b66" font-weight="400" text-anchor="start">Publisher + recent updates</text>
<rect x="24" y="207" width="372" height="76" rx="10" fill="#fff6e5" stroke="#805a15"/>
<text x="42" y="237" font-size="17" fill="#805a15" font-weight="700" text-anchor="start">02</text>
<text x="83" y="237" font-size="21" fill="#191b20" font-weight="650" text-anchor="start">SSH authorized_keys</text>
<text x="83" y="263" font-size="17" fill="#555b66" font-weight="400" text-anchor="start">Recognized owner for every key</text>
<rect x="24" y="292" width="372" height="76" rx="10" fill="#e8eef8" stroke="#1f4b99"/>
<text x="42" y="322" font-size="17" fill="#1f4b99" font-weight="700" text-anchor="start">03</text>
<text x="83" y="322" font-size="21" fill="#191b20" font-weight="650" text-anchor="start">Agent sessions</text>
<text x="83" y="348" font-size="17" fill="#555b66" font-weight="400" text-anchor="start">Active sessions + token access</text>
<rect x="24" y="377" width="372" height="76" rx="10" fill="#fff6e5" stroke="#805a15"/>
<text x="42" y="407" font-size="17" fill="#805a15" font-weight="700" text-anchor="start">04</text>
<text x="83" y="407" font-size="21" fill="#191b20" font-weight="650" text-anchor="start">Deploy credentials</text>
<text x="83" y="433" font-size="17" fill="#555b66" font-weight="400" text-anchor="start">Scope + environment exposure</text>
<rect x="24" y="462" width="372" height="76" rx="10" fill="#e8eef8" stroke="#1f4b99"/>
<text x="42" y="492" font-size="17" fill="#1f4b99" font-weight="700" text-anchor="start">05</text>
<text x="83" y="492" font-size="21" fill="#191b20" font-weight="650" text-anchor="start">MCP + skills</text>
<text x="83" y="518" font-size="17" fill="#555b66" font-weight="400" text-anchor="start">Scripts + connected services</text>
<rect x="24" y="555" width="372" height="70" rx="10" fill="#fdecec" stroke="none"/>
<text x="42" y="584" font-size="18" fill="#953b3b" font-weight="650" text-anchor="start">Suspected exposure?</text>
<text x="42" y="609" font-size="17" fill="#953b3b" font-weight="400" text-anchor="start">Isolate → revoke → inspect → re-issue</text></g>
</svg>
