<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 556" role="img" aria-labelledby="title desc">
<title id="title">Put checks at the right time</title><desc id="desc">A repository session, with clear gates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b6becb" stroke-width="1.5"/></marker></defs>
<rect width="420" height="556" rx="12" fill="#16191e"/>
<g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="24" y="31" font-size="12" fill="#b6becb" font-weight="650" text-anchor="start">OPC / FIELD GUIDE</text>
<text x="24" y="68" font-size="25" fill="#edf0f5" font-weight="700" text-anchor="start">Put checks at the right time</text>
<text x="24" y="96" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">A repository session, with clear gates.</text>
<path d="M43 155 V416" fill="none" stroke="#455061" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="63" y="124" width="333" height="94" rx="10" fill="#24314a" stroke="none"/>
<rect x="35" y="155" width="16" height="16" rx="8" fill="#a4c2ff" stroke="none"/>
<text x="80" y="151" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">Before a tool call</text>
<text x="80" y="179" font-size="23" fill="#a4c2ff" font-weight="700" text-anchor="start">PreToolUse</text>
<text x="80" y="204" font-size="17" fill="#edf0f5" font-weight="400" text-anchor="start">Can reject the call</text>
<rect x="63" y="232" width="333" height="94" rx="10" fill="#3b3020" stroke="none"/>
<rect x="35" y="263" width="16" height="16" rx="8" fill="#e8c783" stroke="none"/>
<text x="80" y="259" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">After successful execution</text>
<text x="80" y="287" font-size="23" fill="#e8c783" font-weight="700" text-anchor="start">PostToolUse</text>
<text x="80" y="312" font-size="17" fill="#edf0f5" font-weight="400" text-anchor="start">Checks work already done</text>
<rect x="63" y="340" width="333" height="94" rx="10" fill="#20362a" stroke="none"/>
<rect x="35" y="371" width="16" height="16" rx="8" fill="#9cd6ae" stroke="none"/>
<text x="80" y="367" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">Before finishing</text>
<text x="80" y="395" font-size="23" fill="#9cd6ae" font-weight="700" text-anchor="start">Stop</text>
<text x="80" y="420" font-size="17" fill="#edf0f5" font-weight="400" text-anchor="start">Checks completion conditions</text>
<rect x="24" y="463" width="372" height="70" rx="10" fill="#3b3020" stroke="none"/>
<text x="42" y="492" font-size="18" fill="#e8c783" font-weight="650" text-anchor="start">After-the-fact checks cannot undo</text>
<text x="42" y="517" font-size="17" fill="#e8c783" font-weight="400" text-anchor="start">an action that already ran.</text></g>
</svg>
