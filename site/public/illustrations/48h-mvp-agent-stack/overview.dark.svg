<text x="24" y="151" font-size="14" fill="#b6becb" font-weight="400" text-anchor="start">0h</text>
<text x="396" y="151" font-size="14" fill="#b6becb" font-weight="400" text-anchor="end">48h</text>
<text x="24" y="194" font-size="17" fill="#a4c2ff" font-weight="700" text-anchor="start">0–4h</text>
