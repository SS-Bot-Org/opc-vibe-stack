<text x="24" y="68" font-size="25" fill="#edf0f5" font-weight="700" text-anchor="start">The 48-hour runway</text>
<text x="24" y="96" font-size="17" fill="#b6becb" font-weight="400" text-anchor="start">Four timeboxes. One working outcome.</text>
