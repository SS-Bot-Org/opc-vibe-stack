<rect x="24" y="526" width="372" height="70" rx="10" fill="#3b3020" stroke="none"/>
<text x="42" y="555" font-size="18" fill="#e8c783" font-weight="650" text-anchor="start">At each boundary: cut scope.</text>
<text x="42" y="580" font-size="17" fill="#e8c783" font-weight="400" text-anchor="start">Keep the deadline; reduce the work.</text></g>
